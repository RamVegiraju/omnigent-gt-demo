name: github-policy-demo
description: Codex demo of Omnigent's built-in GitHub policy.

executor:
  harness: codex
  model: databricks-gpt-5-3-codex
  auth:
    type: databricks
    profile: adb-984752964297111

prompt: |
  You are a coding assistant working in this repository. Use github_cli for
  git and GitHub operations so they are governed by repository policy.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

policies:
  github_guard:
    type: function
    function:
      path: omnigent.policies.builtins.github.github_policy
      arguments:
        read_all: true
        write_repos: [RamVegiraju/omnigent-gt-demo]
        write_branches: [agent-demo]
        allow_destructive: false
        deny_tag_push: true
        deny_force_push: true
        shell_tools: [github_cli]

tools:
  github_cli:
    type: function
    description: >-
      Run one git or gh command in the current repository.
    callable: github_tools.github_cli
