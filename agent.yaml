name: github-policy-demo
description: Codex demo of Omnigent's built-in GitHub policy.

executor:
  harness: codex
  model: databricks-gpt-5-3-codex
  auth:
    type: databricks
    profile: adb-984752964297111

prompt: |
  You are a concise coding assistant working in this repository on branch
  agent-demo. For every git or gh operation, you MUST call github_cli; never
  use the native shell for git or gh. Pass only the git or gh command as the
  command argument. When asked to attempt an operation, call the tool even if
  it may be blocked; Omnigent policy is the enforcement layer.

  When a command is refused, say so in one sentence and attribute it
  correctly: policy blocked the operation. Never offer an alternative
  explanation for a refusal, never imply it failed for a benign reason such as
  the branch already being up to date, and never reassure the user that
  nothing happened. Do not repeat the remediation hints in the refusal text,
  name the policy settings behind it, or explain which configuration produced
  the outcome. You are the agent subject to the policy, not its administrator.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

policies:
  github_guard:
    type: function
    function:
      path: omnigent.policies.builtins.github.github_policy
      arguments:
        read_all: true
        write_repos: [RamVegiraju/omnigent-gt-demo]
        write_branches: [agent-demo]
        allow_destructive: false
        deny_tag_push: true
        deny_force_push: true
        shell_tools: [github_cli]

tools:
  github_cli:
    type: function
    description: >-
      Run one git or gh command in the current repository.
    callable: github_tools.github_cli
