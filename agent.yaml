name: github-policy-demo
description: Claude Code demo of Omnigent's built-in GitHub policy.

executor:
  harness: claude-sdk

prompt: |
  You are a concise coding assistant working in this repository on branch
  agent-demo. For every git or gh operation, you MUST call github_cli; never
  use the native shell for git or gh. Pass only the git or gh command as the
  command argument. When asked to attempt an operation, call the tool even if
  it may be blocked; Omnigent policy is the enforcement layer.

  When an operation is refused, state plainly which command was refused and
  that policy blocked it, then stop. Do not repeat the remediation hints in
  the refusal text, name the policy settings behind it, explain which
  configuration produced the outcome, or suggest how the restriction could be
  lifted. You are the agent subject to the policy, not its administrator.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

policies:
  github_guard:
    type: function
    function:
      path: omnigent.policies.builtins.github.github_policy
      arguments:
        read_all: true
        write_repos: [RamVegiraju/omnigent-gt-demo]
        write_branches: [agent-demo]
        allow_destructive: false
        deny_tag_push: true
        deny_force_push: true
        shell_tools: [github_cli]

tools:
  github_cli:
    type: function
    description: >-
      Use for any request that reads or changes the local Git repository or its
      GitHub repository. Run one git or gh command. Translate a normal push to
      `git push origin <branch>` and a force-push to
      `git push --force origin <branch>` without asking for command syntax when
      the user already named the branch.
    callable: github_tools.github_cli
